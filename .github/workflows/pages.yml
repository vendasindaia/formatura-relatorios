name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # false, e não true: com a fila do Actions lenta, cancel-in-progress derruba o deploy
  # que estava esperando a vez em vez de só evitar dois publicando junto.
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          # O Pages tem passado bem dos 10 min padrão para confirmar o deploy e o
          # action cancela o deployment ao estourar. 30 min evita cancelar um deploy que ia dar certo.
          timeout: 1800000
